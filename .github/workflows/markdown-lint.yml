name: Validadores e Documentação

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test-validators:
    name: Testar Validadores da Skill (Node.js)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Executar Suíte de Testes dos Validadores
        run: node --test skills/security-audit/*.test.cjs

  lint-docs:
    name: Validar Markdown e Links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Instalar Markdownlint CLI
        run: npm install -g markdownlint-cli

      - name: Executar Lint de Markdown
        run: |
          markdownlint '**/*.md' --ignore 'node_modules' --config .markdownlint.json || true
